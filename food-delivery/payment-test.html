<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Razorpay Payment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    button {
      padding: 12px 24px;
      background: #3399cc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      min-height: 50px;
    }
  </style>
</head>
<body>

  <h2>💳 Razorpay Payment Test</h2>
  <p>Order Amount: ₹880</p>

  <button onclick="startPayment()">Pay Now</button>

  <div id="result"></div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    async function startPayment() {
      const resultEl = document.getElementById('result');
      resultEl.innerHTML = 'Loading...';

      // Yahan wahi values daalo jo backend response mein mili thi
      const razorpayOrderId = 'order_T8bvRycvqdmj7Z';
      const amount = 88000; // <-- paise mein amount
      const keyId = 'rzp_test_T8ZTpkmfMF07kT'; // <-- apna keyId
      const dbOrderId = '6a45e059e7c756ecd3f6d881'; // <-- apna MongoDB order _id

      const options = {
        key: keyId,
        amount: amount,
        currency: 'INR',
        name: 'Food Delivery App',
        description: 'Order Payment',
        order_id: razorpayOrderId,
        handler: async function (response) {
          resultEl.innerHTML = 'Verifying payment...';

          // Payment hone ke baad backend ko verify karne ke liye bhejo
          const verifyRes = await fetch('http://localhost:5000/api/payments/verify', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhNDVjNGQyNzYyMzQzMDBkZDAyNTdiNSIsImlhdCI6MTc4Mjk4MDY5OSwiZXhwIjoxNzg1NTcyNjk5fQ.dn6XI8SJpwDq9qozbeG7l_0D8iQg6M5gjQVx5sQUqsI'
            },
            body: JSON.stringify({
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
              orderId: dbOrderId
            })
          });

          const data = await verifyRes.json();
          resultEl.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        },
        prefill: {
          name: 'Anushri Mishra',
          email: 'anushrimishra20@gmail.com',
          contact: '9876543210'
        },
        theme: {
          color: '#3399cc'
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>

</body>
</html>
